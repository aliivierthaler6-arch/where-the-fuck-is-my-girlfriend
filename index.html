 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where the fuck is my girlfriend?</title>

  <!-- Fonts: Pinyon Script (title), Inika (everything else) -->
  <link href="https://fonts.googleapis.com/css2?family=Inika:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    :root {
      --card-bg: rgba(255,255,255,0.16);
      --ink:#1b1330;
      --ring: rgba(255,255,255,0.45);
      --accent:#b388ff;
      --shadow: 0 12px 30px rgba(20,10,40,.18);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    /* ===== Themes ===== */
    body{
      margin:0;
      /* Ali'i theme: purple hearts + gradient */
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4.02 4 6.5 4c1.73 0 3.39 1 4.2 2.43C11.51 5 13.17 4 14.9 4 17.38 4 19.4 6 19.4 8.5c0 3.78-3.41 6.86-8.55 11.53L12 21.35z' fill='%23100a22' fill-opacity='0.26'/></svg>") repeat,
        linear-gradient(160deg,#eddcff,#dcc6ff);
      background-size: 36px 36px, auto;

      color:var(--ink);
      font-family: 'Inika', serif;
      display:grid;
      place-items:center;
      padding:24px;
    }

    /* Miles theme: pink pastel hearts + gradient */
    body.miles-theme{
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4.02 4 6.5 4c1.73 0 3.39 1 4.2 2.43C11.51 5 13.17 4 14.9 4 17.38 4 19.4 6 19.4 8.5c0 3.78-3.41 6.86-8.55 11.53L12 21.35z' fill='%238a1f5c' fill-opacity='0.26'/></svg>") repeat,
        linear-gradient(160deg,#ffe4ef,#f6c1dc);
      background-size: 36px 36px, auto;
    }

    /* L-hold: pulse the BACKGROUND hearts 3x, 1s each */
    body.hearts-pulse { animation: heartsPulse 1s ease-in-out 3; }
    @keyframes heartsPulse {
      0%,100% { background-size: 36px 36px, auto; }
      50%     { background-size: 44px 44px, auto; }
    }

    .wrap{ width:min(840px,95vw); text-align:center; position:relative; z-index:1; }

    .card{
      background:var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border:2px solid var(--ring);
      border-radius:22px;
      padding:22px clamp(14px,4vw,28px);
      box-shadow: var(--shadow);
      color:var(--ink);
      text-align:center;
      position:relative;
    }
    .header-card { margin-bottom: 16px; }

    .title{
      margin:0;
      font-family:'Pinyon Script', cursive;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 400;
      color:#000;
      line-height:1.05;
    }
    #dayLabel{
      margin:8px 0 0 0;
      font-size: clamp(16px, 3.6vw, 28px);
      font-weight: 700;
      letter-spacing:.2px;
      color:#000;
      font-family: 'Inika', serif;
    }

    .big{
      font-size: clamp(22px, 4.6vw, 34px);
      font-weight: 700;
      line-height: 1.25;
      cursor: default;
    }
    .big.clickable { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    .range, .clock{
      font-size: clamp(14px, 2.6vw, 18px);
      opacity: 0.95;
      margin-top:10px;
      font-weight: 400;
    }

    /* Toggles */
    .toggle{
      position:absolute;
      top:10px;
      background: var(--accent);
      color:#fff;
      border:none;
      cursor:pointer;
      font-weight:700;
      border-radius:999px;
      padding:6px 12px;
      box-shadow:0 8px 18px rgba(0,0,0,.15);
      letter-spacing:.2px;
      font-family: 'Inika', serif;
      z-index: 30;
    }
    #personToggle{ left:10px; }
    #tzToggle{ right:10px; }

    .menu{
      position:absolute;
      top:48px;
      background:#fff;
      color:#1f1236;
      border-radius:12px;
      border:2px solid var(--ring);
      box-shadow: var(--shadow);
      display:none;
      min-width: 210px;
      overflow:hidden;
      text-align:left;
      font-family: 'Inika', serif;
      z-index: 40;
    }
    #personMenu{ left:10px; }
    #tzMenu{ right:10px; }

    .menu-item{
      padding:10px 12px;
      cursor:pointer;
      font-weight:700;
      border-bottom:1px solid #00000010;
    }
    .menu-item:last-child{ border-bottom:none; }
    .menu-item:hover{ background:#f3ecff; }

    /* FX overlay for Konami storm */
    .fx-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .kiss{
      position: absolute;
      top: -10vh;
      will-change: transform, opacity;
      animation-name: fall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.15));
    }
    @keyframes fall{
      0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) translateX(var(--drift, 0px)) rotate(var(--rot, 0deg)); opacity: 0.9; }
    }

    @media (prefers-reduced-motion:no-preference){
      .fade{ animation:fade .4s ease-out }
      @keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
    }
    @media (prefers-reduced-motion: reduce){
      body.hearts-pulse { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="widgetRoot" tabindex="0" aria-label="Class widget">
    <div class="card header-card fade">
      <h1 id="titleText" class="title">Where the fuck is my girlfriend?</h1>
      <h2 id="dayLabel">Loading…</h2>
    </div>

    <div class="card fade">
      <!-- Person toggle -->
      <button id="personToggle" class="toggle" aria-haspopup="true" aria-expanded="false">✨ Ali’i</button>
      <div id="personMenu" class="menu" role="menu" aria-label="Whose schedule">
        <div class="menu-item" data-person="ALII" role="menuitem">✨ Ali’i</div>
        <div class="menu-item" data-person="MILES" role="menuitem">👑 Miles</div>
      </div>

      <!-- Display TZ toggle -->
      <button id="tzToggle" class="toggle" aria-haspopup="true" aria-expanded="false">🌴 California</button>
      <div id="tzMenu" class="menu" role="menu" aria-label="Display timezone">
        <div class="menu-item" data-tz="CA" role="menuitem">🌴 California</div>
        <div class="menu-item" data-tz="CHI" role="menuitem">🫘 Chicago</div>
      </div>

      <div id="status" class="big">Loading…</div>
      <div id="range" class="range">—</div>
      <div id="clock" class="clock">—</div>
    </div>
  </div>

  <script>
    /* =========================
       Schedules
       0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
       ========================= */

    const PEOPLE = {
      ALII: {
        label: "✨ Ali’i",
        logicTZ: "America/Los_Angeles",
        schedule: {
          1: [ // Monday
            { name: "Intro to Art",                start: "10:00", end: "12:00" },
            { name: "Political Thought East&West", start: "13:15", end: "14:30" },
          ],
          2: [ // Tuesday
            { name: "Philosophical Questions",     start: "11:00", end: "12:15" },
          ],
          3: [ // Wednesday
            { name: "Intro to Art",                start: "10:00", end: "12:00" },
            { name: "Political Thought East&West", start: "13:15", end: "14:30" },
            { name: "Perspectives on Contemporary Art", start: "14:45", end: "17:30" },
          ],
          4: [ // Thursday
            { name: "Philosophical Questions",     start: "11:00", end: "12:15" },
          ],
          5: [],
          0: [], 6: []
        }
      },
      MILES: {
        label: "👑 Miles",
        logicTZ: "America/Chicago",
        schedule: {
          1: [ // Monday
            { name: "Readings in World Literature II", start: "13:30", end: "14:50" },
          ],
          2: [ // Tuesday
            { name: "Principles of Macro-Economics",   start: "15:30", end: "16:50" },
          ],
          3: [ // Wednesday
            { name: "Readings in World Literature II", start: "13:30", end: "14:50" },
            { name: "Principles of Macro-Economics",   start: "19:30", end: "20:20" },
          ],
          4: [ // Thursday
            { name: "Principles of Macro-Economics",   start: "15:30", end: "16:50" },
          ],
          5: [ // Friday
            { name: "Media Art and Design Practice",   start: "12:30", end: "15:20" },
          ],
          0: [], 6: []
        }
      }
    };

    // Display timezones (DST-safe, real tz handling)
    const DISPLAY_OPTS = {
      CA:  { label: "🌴 California", tz: "America/Los_Angeles" },
      CHI: { label: "🫘 Chicago",    tz: "America/Chicago" },
    };

    let activePerson = localStorage.getItem("activePerson") || "ALII";
    let displayKey   = localStorage.getItem("displayTZ") || "CA";

    // ---------- Helpers ----------
    function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
    function minutesSinceMidnight(d){ return d.getHours()*60 + d.getMinutes(); }

    function nowInTZ(tz){
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: tz, year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      });
      const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
      return new Date(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`);
    }

    // --- DST-safe conversion from a wall-time in a "logic tz" to display tz ---
    function tzParts(date, tz) {
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      });
      const p = Object.fromEntries(fmt.formatToParts(date).map(x => [x.type, x.value]));
      return { year: Number(p.year), month: Number(p.month), day: Number(p.day) };
    }

    function tzOffsetMinutes(tz, date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        timeZoneName: "shortOffset",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(date);

      const tzn = parts.find(p => p.type === "timeZoneName")?.value || "GMT+00:00";
      const m = tzn.match(/GMT([+-])(\d{1,2})(?::?(\d{2}))?/);
      if (!m) return 0;

      const sign = m[1] === "-" ? -1 : 1;
      const hh = Number(m[2]);
      const mm = Number(m[3] || "0");
      return sign * (hh * 60 + mm);
    }

    function instantFromWallTimeToday(logicTZ, hhmm) {
      const today = tzParts(new Date(), logicTZ);
      const [hh, mm] = hhmm.split(":").map(Number);

      // Use offset at midday of that local date to avoid edge weirdness.
      const middayUTC = Date.UTC(today.year, today.month - 1, today.day, 12, 0, 0);
      const offset = tzOffsetMinutes(logicTZ, new Date(middayUTC));

      const utcMillis = Date.UTC(today.year, today.month - 1, today.day, hh, mm, 0) - offset * 60_000;
      return new Date(utcMillis);
    }

    function fmtInTZ(date, tz) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(date);
    }

    function fmtRangeDisplay(startHHMM, endHHMM, logicTZ) {
      const dispTZ = DISPLAY_OPTS[displayKey].tz;
      const s = instantFromWallTimeToday(logicTZ, startHHMM);
      const e = instantFromWallTimeToday(logicTZ, endHHMM);
      return `${fmtInTZ(s, dispTZ)} – ${fmtInTZ(e, dispTZ)}`;
    }

    function currentBlockForSchedule(sched, dayIndex, minutes){
      const blocks = sched[dayIndex] || [];
      for (const b of blocks){
        const s = toMinutes(b.start), e = toMinutes(b.end);
        if (minutes >= s && minutes < e) return b;
      }
      return null;
    }

    // Emojis for classes
    function decorate(name){
      if (/Intro to Art/i.test(name)) return "🎨 Intro to Art";
      if (/Political Thought/i.test(name)) return "📜 Political Thought East&West";
      if (/Philosophical Questions/i.test(name)) return "❓ Philosophical Questions";
      if (/Perspectives on Contemporary Art/i.test(name)) return "🖼️ Perspectives on Contemporary Art";

      if (/Macro/i.test(name)) return "📈 Principles of Macro-Economics";
      if (/World Literature/i.test(name)) return "📚 Readings in World Literature II";
      if (/Media Art/i.test(name)) return "🧩 Media Art and Design Practice";

      return name;
    }

    // ---------- DOM ----------
    const root        = document.getElementById("widgetRoot");
    const titleEl     = document.getElementById("titleText");
    const dayLabelEl  = document.getElementById("dayLabel");
    const statusEl    = document.getElementById("status");
    const rangeEl     = document.getElementById("range");
    const clockEl     = document.getElementById("clock");

    const tzToggle    = document.getElementById("tzToggle");
    const tzMenu      = document.getElementById("tzMenu");
    const personToggle= document.getElementById("personToggle");
    const personMenu  = document.getElementById("personMenu");

    function setMenu(menuEl, show){
      menuEl.style.display = show ? "block" : "none";
    }

    function applyThemeAndTitle(){
      if (activePerson === "MILES") {
        document.body.classList.add("miles-theme");
        titleEl.textContent = "Where the Fuck is my Boyfriend?";
      } else {
        document.body.classList.remove("miles-theme");
        titleEl.textContent = "Where the fuck is my girlfriend?";
      }
    }

    function updateToggleUI(){
      tzToggle.textContent = DISPLAY_OPTS[displayKey].label;
      personToggle.textContent = PEOPLE[activePerson].label;
      tzToggle.setAttribute("aria-expanded", tzMenu.style.display === "block");
      personToggle.setAttribute("aria-expanded", personMenu.style.display === "block");
      applyThemeAndTitle();
    }

    tzToggle.addEventListener("click", () => {
      setMenu(tzMenu, tzMenu.style.display !== "block");
      setMenu(personMenu, false);
      updateToggleUI();
    });
    tzMenu.addEventListener("click", (e) => {
      const item = e.target.closest(".menu-item");
      if(!item) return;
      displayKey = item.dataset.tz;
      localStorage.setItem("displayTZ", displayKey);
      setMenu(tzMenu, false);
      updateToggleUI();
      update();
    });

    personToggle.addEventListener("click", () => {
      setMenu(personMenu, personMenu.style.display !== "block");
      setMenu(tzMenu, false);
      updateToggleUI();
    });
    personMenu.addEventListener("click", (e) => {
      const item = e.target.closest(".menu-item");
      if(!item) return;
      activePerson = item.dataset.person;
      localStorage.setItem("activePerson", activePerson);
      setMenu(personMenu, false);
      updateToggleUI();
      update();
    });

    document.addEventListener("click", (e) => {
      if (!tzMenu.contains(e.target) && e.target !== tzToggle) setMenu(tzMenu, false);
      if (!personMenu.contains(e.target) && e.target !== personToggle) setMenu(personMenu, false);
      updateToggleUI();
    });

    // ---------- Ali’i locked quip rotation (ONLY when Ali’i is not in class) ----------
    const lockedBase = "She's locked asf";
    const LOCKED_QUIPS = [
      "IDK but did you know Tame Impala is only one guy?!",
      "Probably not her homework.",
      "She’s hydrating aggressively",
      "She’s calibrating the vibesometer.",
      "Learning things to tell you first.",
      "She’s thinking about you I can’t lie",
      "Bro… She’s still just missing you",
      "You wouldn’t believe me if I told you.",
      "Straight Jorkin it",
      "She’s watching you through your computer (lovingly)",
      "Can’t tell you that. It’s top-secret.",
      "Counting down the minutes until she can see you again.",
      "Imagining what she would look like if she was a worm",
      "Mentally in Chicago, physically in Pitzer",
      "Plot twist: she’s actually studying",
      "nvm she’s on her phone watching reels",
      "Snacking on some feminist literature (She’s 6’2 btw);)",
      "She’s Pondering",
      "She’s hitting her vape in the bathroom",
      "Explaining the entire timeline of how they caught Osama Bin Laden."
    ];
    let lockedIndex = -1;
    let isAliiLockedNow = false;

    statusEl.addEventListener("click", () => {
      if (!(activePerson === "ALII" && isAliiLockedNow)) return;
      lockedIndex++;
      if (lockedIndex >= LOCKED_QUIPS.length) lockedIndex = -1;
      renderAliiLockedLine();
    });

    function renderAliiLockedLine(){
      statusEl.classList.add("clickable");
      statusEl.textContent = (lockedIndex === -1) ? lockedBase : LOCKED_QUIPS[lockedIndex];
    }

    // ---------- Main update ----------
    function update(){
      const person = PEOPLE[activePerson];

      // Logic time anchored to the active person’s timezone
      const nowLogic = nowInTZ(person.logicTZ);
      const dayIndex = nowLogic.getDay();
      const mins     = minutesSinceMidnight(nowLogic);

      // Day label + live clock in selected display timezone
      const dispTZ = DISPLAY_OPTS[displayKey].tz;
      dayLabelEl.textContent = new Intl.DateTimeFormat("en-US", { weekday:"long", timeZone: dispTZ }).format(new Date());
      clockEl.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: dispTZ, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true
      }).format(new Date());

      const blocks = person.schedule[dayIndex] || [];
      const block  = currentBlockForSchedule(person.schedule, dayIndex, mins);

      if (block){
        // In class
        isAliiLockedNow = false;
        statusEl.classList.remove("clickable");
        statusEl.textContent = decorate(block.name);
        rangeEl.textContent  = `${fmtRangeDisplay(block.start, block.end, person.logicTZ)} (${DISPLAY_OPTS[displayKey].label})`;

        if (activePerson === "ALII") lockedIndex = -1;

      } else {
        // Not in class
        statusEl.classList.remove("clickable");

        if (activePerson === "MILES") {
          isAliiLockedNow = false;
          statusEl.textContent = "Not in Class right now";
          rangeEl.textContent = "";
          return;
        }

        // Ali’i not in class: keep the locked baseline + rotating quips
        isAliiLockedNow = true;
        renderAliiLockedLine();

        const next = blocks.find(b => mins < toMinutes(b.start));
        if (next){
          rangeEl.textContent = `Next Class: ${decorate(next.name)} • ${fmtRangeDisplay(next.start, next.end, person.logicTZ)} (${DISPLAY_OPTS[displayKey].label})`;
        } else {
          rangeEl.textContent = "";
        }
      }
    }

    updateToggleUI();
    update();
    setInterval(update, 1000);

    // ================================
    // Konami & L-hold (widget-scoped), with capture to beat global easter eggs
    // ================================
    let isHovering = false;
    let tapActive = false;
    let tapTimer = null;
    root.addEventListener("mouseenter", ()=>{ isHovering = true; });
    root.addEventListener("mouseleave", ()=>{ isHovering = false; });
    root.addEventListener("pointerdown", ()=>{
      tapActive = true;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(()=>{ tapActive = false; }, 8000);
    });
    root.addEventListener("focusin", ()=>{
      tapActive = true;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(()=>{ tapActive = false; }, 8000);
    });
    function widgetActive(){ return isHovering || tapActive; }

    const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
    const KONAMI_KEYS = new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","b","a"]);
    let buffer = [];

    window.addEventListener("keydown", (e) => {
      const normalized = (e.key.length === 1 ? e.key.toLowerCase() : e.key);

      if (widgetActive() && KONAMI_KEYS.has(normalized)) {
        e.stopImmediatePropagation?.();
        e.stopPropagation();
        e.preventDefault();
      }

      if (!widgetActive()) return;

      if (normalized === "l") handleLHoldStart();

      buffer.push(normalized);
      if (buffer.length > KONAMI.length) buffer.shift();

      const match = KONAMI.every((v, i) => {
        const expect = v.length === 1 ? v.toLowerCase() : v;
        return buffer[i] === expect;
      });
      if (match) {
        triggerKissStorm();
        buffer = [];
      }
    }, true);

    window.addEventListener("keyup", (e)=>{
      if (e.key.toLowerCase() === "l") handleLHoldEnd();
    }, true);

    let lHoldTimer = null;
    let lHolding = false;
    function handleLHoldStart(){
      if (lHolding) return;
      lHolding = true;
      clearTimeout(lHoldTimer);
      lHoldTimer = setTimeout(()=>{
        if (widgetActive()){
          document.body.classList.add("hearts-pulse");
          setTimeout(()=>document.body.classList.remove("hearts-pulse"), 3200);
        }
        lHolding = false;
      }, 3000);
    }
    function handleLHoldEnd(){
      clearTimeout(lHoldTimer);
      lHolding = false;
    }

    function triggerKissStorm(){
      const layer = document.createElement("div");
      layer.className = "fx-layer";
      layer.setAttribute("aria-hidden", "true");
      document.body.appendChild(layer);

      const EMOJIS = ["❤️","💋"];
      const start = Date.now();
      const duration = 5000;
      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);

      const tick = () => {
        const burstCount = 12 + Math.floor(Math.random()*10);
        for (let i=0;i<burstCount;i++){
          const span = document.createElement("span");
          span.className = "kiss";
          span.textContent = EMOJIS[Math.random()<0.65 ? 0 : 1];

          const left = Math.random()*vw;
          const size = 16 + Math.random()*28;
          const delay = Math.random()*0.25;
          const drift = (Math.random()*200 - 100) + "px";
          const rot   = (Math.random()*360 - 180) + "deg";
          const fallDur = (3.8 + Math.random()*1.8).toFixed(2) + "s";

          span.style.left = left + "px";
          span.style.fontSize = size + "px";
          span.style.animationDelay = delay + "s";
          span.style.animationDuration = fallDur;
          span.style.setProperty("--drift", drift);
          span.style.setProperty("--rot", rot);

          layer.appendChild(span);
        }

        if (Date.now() - start < duration){
          stormTimer = setTimeout(tick, 140 + Math.random()*120);
        }
      };

      let stormTimer = setTimeout(tick, 0);

      setTimeout(()=>{
        clearTimeout(stormTimer);
        setTimeout(()=>layer.remove(), 1800);
      }, duration);
    }
  </script>
</body>
</html>
